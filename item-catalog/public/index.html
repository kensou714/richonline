<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>游戏资料 · 大富翁 Online</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script defer src="catalog.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <nav id="catalog-nav" aria-label="游戏资料导航">
    <a href="#cards">道具卡</a>
    <a href="#events">事件</a>
    <a href="#roles">角色</a>
    <a href="#npcs">NPC</a>
    <a href="#maps">地图</a>
    <a href="#mall">商城道具</a>
    <a href="#sounds">音效</a>
    <a href="#music">背景音乐</a>
  </nav>
  <main>
    <div class="table-container" tabindex="0" role="region" aria-label="资料表，可横向滚动">
      <table id="catalog-table" aria-label="道具卡资料">
        <colgroup id="table-columns"></colgroup>
        <thead id="table-heading"></thead>
        <tbody id="card-list"></tbody>
      </table>
    </div>
    <div id="pagination" hidden aria-label="列表翻页">
      <span id="page-summary" role="status"></span>
      <button id="previous-page" type="button">上一页</button>
      <label>第 <select id="page-number" aria-label="选择页码"></select> 页</label>
      <button id="next-page" type="button">下一页</button>
    </div>
    <noscript>请开启浏览器的 JavaScript，以显示游戏资料。</noscript>
  </main>
</body>
</html>
